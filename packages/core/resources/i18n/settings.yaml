  search.help.custom_engine.body.desktop: "You can edit a preset engine's request template on its detail page and restore the defaults; you can also create a custom engine by pasting a curl command and describe any search API with a template (the {{query}}/{{count}}/{{apiKey}}/{{baseUrl}} placeholders are supported). The request body defaultBody is optional; leave it empty to let the agent pass parameters at call time. Placeholders go inside string values; write \"{{count}}\" (with quotes) for integer fields and it is converted to a number at run time."
  search.help.custom_engine.body.mobile: You can edit a preset engine's request template on its detail page and restore the defaults; you can also create a custom engine and describe any search API with a template. The agent passes request parameters at call time (GET appends them to the query string / POST merges them into the request body); the API Key is injected from the local keystore only at send time, and the configuration contains only the {{apiKey}} placeholder.
  search.help.custom_engine.title: Templates and custom engines
