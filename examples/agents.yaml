# Import into DB: nm agent import examples/agents.yaml
schemaVersion: 1
agents:
  writer:
    runtime:
      maxSteps: 20
    prompts:
      system: |
        You are a helpful assistant.
      persist:
        persona:
          type: text
          role: user
          content: |
            主角设定示例。
      dynamic:
        state:
          type: text
          role: user
          lifecycle: once
          content: |
            当前时间：{{$time}}（{{$week_cn}}）
            目录：
            {{$filetree}}
  summarizer:
    prompts:
      persist: {}
      dynamic: {}
  # general: 通用 subagent 模板，作为子智能体名单的默认成员（不可删除）
  general:
    description: 通用 subagent 模板，擅长读写文件、搜索内容，可完成主代理委派的探索性任务。
    prompts:
      system: |
        你是一个通用助手，可以读写文件、搜索内容，完成主代理委派的任务。
      persist: {}
      dynamic: {}
