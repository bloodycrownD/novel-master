spec_summary: |
  三 phase 重构。Phase 1 Core：abort registry + controller 注册 + 中断回流语义 +
  ToolResultBlock.meta 扩展。Phase 2 Mobile：四能力（stream/abort/batch/composer）
  拆分 + SubagentSessionScreen 重构 + 子会话停止按钮。Phase 3 Desktop：四能力拆分
  + main 进程接入 core registry + ChatRail 停止按钮。Phase 1 前置于 2/3；2 与 3
  文件域不重叠可并行。
contracts:
  - AgentAbortRegistry: register(sessionId,controller)/abort(sessionId)/unregister(sessionId,controller)(所有权校验)/has(sessionId)
  - AgentTurnRuntimePort.abortRegistry?: 可选字段（CLI 不注入空安全）
  - runAgentTurn: 永远内部 new AbortController() 作 internalController 注册到 registry；
    caller signal 桥接 callerSignal.addEventListener("abort",()=>internalController.abort(reason),{once:true})；
    runner.run 的 signal 改传 internalController.signal；try/finally register/unregister
  - runChildAgent: childController 创建后 register(childSessionId, childController)；
    try/finally unregister；保留 parentSignal 级联
  - TaskToolOutput: 加 readonly stopped?: boolean + readonly failureReason?: string；
    导出 const SUBAGENT_STOP_REASON_USER = "用户停止"
  - subagent-tool run: stopReason==="cancelled" → {text:lastText??"[用户停止，无已生成文本]", subagentSessionId, stopped:true, failureReason:SUBAGENT_STOP_REASON_USER}
  - buildToolResultBlock: ok 分支 output.stopped===true → {ok:false, content:output.text, meta:{subagentSessionId, failureReason}}
  - ToolResultBlock.meta: { subagentSessionId?: string; failureReason?: string }
  - 两端 runtime 装配注入 abortRegistry: createAgentAbortRegistry()
