  - task 静态内置工具，registerBuiltinTools 注册，不进用户 allow/deny
  - validateAgentToolPolicy 内部从 registryNames 过滤掉 "task"（AC-9）
  - upsert 禁止 name==="general"，抛 INVALID_SCHEMA
  - 内置 general 固定 mode="subagent"

