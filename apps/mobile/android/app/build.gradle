apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
def monorepoRoot = file("../../../../").canonicalFile

react {
    /* Folders �&#65533; hoisted deps at monorepo root */
    root = file("../../")
    reactNativeDir = new File(monorepoRoot, "node_modules/react-native")
    codegenDir = new File(monorepoRoot, "node_modules/@react-native/codegen")
    cliFile = new File(monorepoRoot, "node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands �&#65533; monorepo hoists hermes-compiler to repo root (RN 0.83+) */
    def osBin = org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? "win64-bin"
        : (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "osx-bin" : "linux64-bin")
    def hermescName = org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? "hermesc.exe"
        : "hermesc"
    hermesCommand = new File(
        monorepoRoot,
        "node_modules/hermes-compiler/hermesc/${osBin}/${hermescName}",
    ).absolutePath
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.novelmaster"
    defaultConfig {
        applicationId "com.novelmaster"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def ciVersionCode = findProperty("versionCode")?.toString()?.toInteger()
            ?: System.getenv("VERSION_CODE")?.toInteger()
            ?: 1
        def ciVersionName = findProperty("versionName")?.toString()
            ?: System.getenv("VERSION_NAME")
            ?: "1.5.9"
        versionCode ciVersionCode
        versionName ciVersionName
    }
    // debug 只编�&#65533; arm64-v8a + x86_64（见 gradle.properties），打一�&#65533; universal apk 够用了�&#65533;
    // release 才按 ABI 分包，发�&#65533; CI 会用 -PreactNativeArchitectures 覆盖成全架构�&#65533;
    splits {
        abi {
            // �&#65533; buildType 判定是否�&#65533; ABI 分包：仅当本次目标包�&#65533; release 变体才分包�&#65533;
            // 避免用任务名是否泛匹�&#65533; release—�&#65533;./gradlew build �&#65533; taskNames=[build] 会误判�&#65533;
            enable gradle.startParameter.taskNames.any { taskName ->
                taskName.contains('assembleRelease') || taskName.contains('bundleRelease')
            }
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePath = findProperty("android.injected.signing.store.file")?.toString()
                ?: System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword findProperty("android.injected.signing.store.password")?.toString()
                    ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias findProperty("android.injected.signing.key.alias")?.toString()
                    ?: System.getenv("ANDROID_KEY_ALIAS")
                keyPassword findProperty("android.injected.signing.key.password")?.toString()
                    ?: System.getenv("ANDROID_KEY_PASSWORD")
            } else {
                // Local / CI without secrets: debug keystore (not for Play Store).
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

/**
 * WebView 壳（chat-transcript / rich-document / code-editor 三包）由
 * `npm run build:webview:native` 拷入 `src/main/assets/webview/`（gitignore）�&#65533;
 * 若漏�&#65533; gradlew 编译�&#65533; APK 会缺文件，运行时会报 net::ERR_FILE_NOT_FOUND�&#65533;
 * 所以在 preBuild 前强制失败，避免静默打出损坏包�&#65533;
 */
tasks.register("checkWebViewAssets") {
    doLast {
        def packages = ["chat-transcript", "rich-document", "code-editor"]
        def required = ["index.html", "app.js", "app.css"]
        def missing = []
        packages.each { pkg ->
            required.each { name ->
                def f = file("src/main/assets/webview/${pkg}/${name}")
                if (!f.isFile()) {
                    missing << f.path
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Missing WebView assets (APK would hit net::ERR_FILE_NOT_FOUND):\n  " +
                    missing.join("\n  ") +
                    "\nRun: npm run build:webview:native -w @novel-master/mobile"
            )
        }
    }
}

tasks.named("preBuild").configure { dependsOn("checkWebViewAssets") }

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
}
