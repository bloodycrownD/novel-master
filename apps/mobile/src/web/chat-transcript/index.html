<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 首帧主题预注入（C′，fix-D 2026-10-18）：head 内联脚本解析期同步执行、
         物理上先于首绘，从宿主 URI 的 hash 读 bg 参数先写 --bg——`#bg=` hash
         全平台保留，`file://`+query 会被部分 WebView 实现丢弃，故兼容解析
         search+hash 双形态。它堵住 transcript.css `background: var(--bg, #fff)`
         兜底白窗的 first-paint 竞态——会话屏消息区冷挂载 ~350ms 白窗
         （2026-10-18 录屏取证）即此；参数先于 stylesheet 生效。参数丢失时由
         RN 侧 B（injectedJavaScriptBeforeContentLoaded）注入兜底。 -->
    <script>
      (function () {
        try {
          var m = /(?:[?&#])bg=([^&#]*)/.exec(location.search + location.hash);
          if (m) {
            var bg = decodeURIComponent(m[1]);
            if (bg) {
              document.documentElement.style.setProperty('--bg', bg);
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <!--
      chat-transcript 独立入口壳（composer-native-2026-10 Step 2）：纯转录文档，
      无 dock / composer 子树——输入框由 RN 原生组件承接，转录侧只管渲染行列表。
      纵向排布：#app（flex 列容器，样式见 transcript.css 基底）→ #scroller(flex:1)
      → #rows（行列表挂载点，createTranscriptRuntime 经 registerRenderRows 渲染）。
      双 portal 刻意留在 body 直接子级——fixed 定位包含块语境与 chat-conversation
      一致（menu/mermaid 全屏不能被 #app 的布局语境裹挟）。
    -->
    <div id="app">
      <div id="scroller"><div id="rows"></div></div>
    </div>
    <!-- Portal 等价宿主：MenuOverlay render 至此，避免与 #rows 互毁。
         刻意留在 body 直接子级——fixed 定位的包含块语境与 chat-conversation 一致，勿移入 #app。 -->
    <div id="menu-portal"></div>
    <!-- Mermaid 全屏覆盖层宿主：与 #menu-portal 平级，renderRows 重建不冲掉；同上为 body 直接子级。 -->
    <div id="mermaid-viewer-portal"></div>
    <script src="./app.js"></script>
  </body>
</html>
